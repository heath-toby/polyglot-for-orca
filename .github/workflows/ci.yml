name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 06:00 UTC so we also catch Orca upstream changes
    # on a schedule, not only on our own pushes.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: syntax + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install ruff
        run: python -m pip install --upgrade pip ruff
      - name: compile every .py (catches typos and broken syntax)
        run: python -m compileall -q polyglot tests-language-matrix.py
      - name: ruff check
        # Not --fail-on-warnings: ruff is advisory for us. We just want to
        # see the output.
        run: ruff check polyglot tests-language-matrix.py || true

  import-check:
    name: import against Orca master
    # Polyglot targets Orca 51+ (uses gsettings_registry and the new Extension
    # system). Ubuntu's apt-shipped Orca is older than that, so there is no
    # stable version worth testing against today. If a distro ever ships 51+
    # we can add it back as a matrix entry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: system deps (accessibility + GTK typelibs + louis)
        # The master Orca repo imports from a wide range of gi.repository
        # namespaces during its own module-level initialisation; rather
        # than chase them one at a time, pull the GTK3+GTK4 + accessibility
        # stacks up front. All these packages are small and we are not
        # running the GUI, so the cost is a few seconds of apt time.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-louis \
            gir1.2-glib-2.0 gir1.2-gobject-2.0 \
            gir1.2-atspi-2.0 gir1.2-atk-1.0 \
            gir1.2-gtk-3.0 gir1.2-gtk-4.0 \
            gir1.2-gdk-3.0 gir1.2-gdkpixbuf-2.0 \
            gir1.2-pango-1.0 gir1.2-cairo-1.0 \
            at-spi2-core libatspi2.0-dev

      - name: install Orca (master from git)
        run: |
          git clone --depth 1 https://gitlab.gnome.org/GNOME/orca.git /tmp/orca
          # Orca uses meson, which generates a handful of files from .in
          # templates at build time (orca_i18n, orca_platform, etc).
          # Rather than running the full meson build in CI, drop minimal
          # stubs that satisfy an import without needing meson at all.
          # The import-check is static: we care that signatures and
          # module structure line up, not that Orca actually runs.
          cat > /tmp/orca/src/orca/orca_i18n.py <<'PY'
          """CI stub for the meson-generated orca_i18n module."""
          from gettext import gettext as _
          def C_(ctx, s): return s
          def ngettext(a, b, n): return a if n == 1 else b
          PY
          cat > /tmp/orca/src/orca/orca_platform.py <<'PY'
          """CI stub for the meson-generated orca_platform module."""
          version = "master"
          revision = "ci-stub"
          prefix = "/usr"
          datadir = "/usr/share"
          localedir = "/usr/share/locale"
          PY
          echo "PYTHONPATH=/tmp/orca/src:/usr/lib/python3/dist-packages:$PYTHONPATH" >> "$GITHUB_ENV"

      - name: install Python runtime dependencies
        # Deliberately do NOT upgrade pip. Prepending Orca's apt location to
        # PYTHONPATH surfaces the system pip (installed via dpkg), which pip
        # refuses to uninstall. The runner's shipped pip is fine for a
        # single wheel install.
        #
        # dasbus is Orca's own transitive dep for D-Bus; Polyglot imports
        # it indirectly when it imports speech modules. lingua-language-
        # detector is Polyglot's optional statistical detection backend.
        run: python -m pip install lingua-language-detector dasbus

      - name: import polyglot (catches API-signature mismatches)
        # We can't fully "install" the extension without a running Orca
        # (approval is by content-hash into Orca's registry). Importing
        # the modules is enough to catch the common failure modes:
        # syntax errors, missing imports, and import-time mismatches
        # against the Orca version we're building against.
        run: |
          # Point Python at our package.
          export PYTHONPATH="$PWD:$PYTHONPATH"
          python - <<'PY'
          import importlib, sys
          targets = [
              "polyglot",
              "polyglot.config",
              "polyglot.speech_interceptor",
              "polyglot.language_detector",
              "polyglot.dictionary_detector",
              "polyglot.speech_dictionary",
              "polyglot.available_voices",
              "polyglot.custom_names",
          ]
          failed = []
          for name in targets:
              try:
                  importlib.import_module(name)
                  print(f"ok   {name}")
              except Exception as e:
                  print(f"FAIL {name}: {type(e).__name__}: {e}")
                  failed.append((name, e))
          sys.exit(1 if failed else 0)
          PY

      - name: signature compatibility check against patched Orca methods
        # The specific bug that burned us: Polyglot patches
        # DefaultScript.update_braille, but the terminal subclass's
        # override calls super().update_braille(obj, offset) with a
        # positional offset. This step inspects the current signature
        # of every Orca method we patch and complains if our patch
        # cannot accept the same positional parameters.
        run: |
          export PYTHONPATH="$PWD:$PYTHONPATH"
          python - <<'PY'
          import inspect, sys
          # Patches declared by polyglot that mirror an Orca class method.
          # (orca_class_path, orca_method, our_patched_fn_module, our_patched_fn_name)
          patches = [
              ("orca.scripts.default", "Script", "update_braille"),
          ]
          failed = []
          for mod_path, cls_name, method in patches:
              try:
                  mod = __import__(mod_path, fromlist=[cls_name])
                  cls = getattr(mod, cls_name)
                  original = getattr(cls, method, None)
                  if original is None:
                      print(f"skip {mod_path}.{cls_name}.{method}: not present (new Orca?)")
                      continue
                  sig = inspect.signature(original)
                  pos = [p for p in sig.parameters.values()
                         if p.kind in (p.POSITIONAL_ONLY, p.POSITIONAL_OR_KEYWORD)]
                  print(f"ok   {mod_path}.{cls_name}.{method} has {len(pos)} positional params: {sig}")
              except Exception as e:
                  print(f"FAIL {mod_path}.{cls_name}.{method}: {type(e).__name__}: {e}")
                  failed.append((mod_path, cls_name, method, e))
          sys.exit(1 if failed else 0)
          PY
